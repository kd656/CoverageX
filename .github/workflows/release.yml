name: Release CoverageX

# Dedicated release pipeline. Triggered by pushing a `release/x.y.z` branch (whose
# POMs / build.gradle.kts carry a fixed, non-SNAPSHOT version). It does NOT re-run the
# full CI matrix (JDK fixtures + Maven/Gradle examples) — that validation already ran on
# `main` before the release branch was cut.
on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - 'release/**'
  workflow_dispatch:
concurrency:
  # Never cancel an in-flight publish.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MAVEN_OPTS: "-Dmaven.artifact.threads=8"

jobs:
  release-maven:
    name: Build & publish Maven release
    runs-on: ubuntu-latest

    env:
      PUBLISH_MODULES: .,coveragex-api,coveragex-test-api,coveragex-core,coveragex-agent,coveragex-maven-plugin,coveragex-test-junit5

    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_PORTAL_USERNAME
          server-password: CENTRAL_PORTAL_PASSWORD

      - name: Read project version
        id: project-version
        working-directory: coveragex
        run: |
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Project version: ${version}"

      - name: Refuse to release a snapshot version
        env:
          PROJECT_VERSION: ${{ steps.project-version.outputs.version }}
        run: |
          if [[ "${PROJECT_VERSION}" == *-SNAPSHOT ]]; then
            echo "::error::Release branch must carry a fixed version, got ${PROJECT_VERSION}." >&2
            exit 1
          fi

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Build, test & deploy release to Central Portal
        working-directory: coveragex
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          # maven-gpg-plugin reads the passphrase from this env var natively. Passing it
          # via -Dgpg.passphrase is deprecated and runs the value through the shell, where
          # characters like $ ` \ " get mangled -> "gpg: Bad passphrase".
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B -Prelease \
            -pl "${PUBLISH_MODULES}" \
            -am deploy

      - name: Upload local CoverageX release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: m2-coveragex-release
          path: ~/.m2/repository/io/github/kd656
          retention-days: 1

  release-gradle:
    name: Build & publish Gradle plugin release
    needs: release-maven
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore local CoverageX release artifacts
        uses: actions/download-artifact@v5
        with:
          name: m2-coveragex-release
          path: ~/.m2/repository/io/github/kd656

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read Gradle plugin version
        id: plugin-version
        working-directory: coveragex/coveragex-gradle-plugin
        run: |
          version="$(./gradlew --no-daemon --quiet properties -Pproperty=version | awk -F': ' '/^version:/{print $2}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Gradle plugin version: ${version}"

      - name: Refuse to release a snapshot version
        env:
          PLUGIN_VERSION: ${{ steps.plugin-version.outputs.version }}
        run: |
          if [[ "${PLUGIN_VERSION}" == *-SNAPSHOT ]]; then
            echo "::error::Release branch must carry a fixed Gradle plugin version, got ${PLUGIN_VERSION}." >&2
            exit 1
          fi

      - name: Test & publish plugin + marker release to Central Portal
        working-directory: coveragex/coveragex-gradle-plugin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew --no-daemon check publishToMavenCentral
